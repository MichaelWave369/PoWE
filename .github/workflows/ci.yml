name: PoWE checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Source syntax
        run: npm run check
      - name: Deterministic tests
        run: npm test
      - name: Synthetic BenchLink conformance
        run: npm run qualify
      - name: Synthetic optical baseline dry run
        run: npm run optical:dry-run
