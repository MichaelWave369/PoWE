name: PoWE checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Source syntax
        run: npm run check
      - name: Deterministic tests
        run: npm test
      - name: Synthetic BenchLink conformance
        run: npm run qualify
      - name: Synthetic optical baseline dry run
        run: npm run optical:dry-run
      - name: Synthetic LightBridge coordination dry run
        run: npm run bridge:dry-run
      - name: Checkout pinned LightBridge reference protocol
        uses: actions/checkout@v4
        with:
          repository: MichaelWave369/LightBridge
          ref: d7cc1ea7ed31c66344a69ab2891ce5c9890d02ca
          path: .interop/lightbridge
          persist-credentials: false
      - name: Cross-repository PLB1 binary interop
        run: node scripts/plb1-crossrepo.mjs .interop/lightbridge/site/src/protocol.js
      - name: Checkout pinned LightBridge field-log reference
        uses: actions/checkout@v4
        with:
          repository: MichaelWave369/LightBridge
          ref: e31a7dddbf89f31d5f1661fcc5fdbb7ffd162cb8
          path: .interop/lightbridge-field
          persist-credentials: false
      - name: Cross-repository optical field-log schema
        run: node scripts/field-crossrepo.mjs .interop/lightbridge-field/site/src/field-log.js
